name: frozen live study

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preflight or one frozen-window session'
        required: true
        default: preflight
        type: choice
        options: [preflight, collect]
      slot:
        description: 'Frozen UTC slot (collection only)'
        required: true
        default: am
        type: choice
        options: [am, pm]
  schedule:
    - cron: '17 3,15 17-23 10 *'

permissions:
  contents: read

concurrency:
  group: frozen-live-study
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check fixed study dates and slot before installing
        id: gate
        env:
          MODE: ${{ inputs.mode }}
          SLOT: ${{ inputs.slot }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import json, os
          from pathlib import Path
          plan = json.loads(Path('configs/study_v1.json').read_text())
          now = datetime.now(timezone.utc)
          mode = os.environ['MODE'] or 'collect'
          slot = os.environ['SLOT'] or ('am' if now.hour < 12 else 'pm')
          allowed = mode == 'preflight' or (plan['start_date_utc'] <= str(now.date()) <= plan['end_date_utc'])
          session = f'{now.date()}-{slot}' if mode == 'collect' else f'preflight-{now:%Y%m%dT%H%M%SZ}'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'run={str(allowed).lower()}\n')
              output.write(f'mode={mode}\n')
              output.write(f'slot={slot}\n')
              output.write(f'session={session}\n')
          PY
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install uv==0.12.23
          uv sync --frozen --python 3.12
      - name: Preflight public feeds
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.mode == 'preflight'
        run: uv run --frozen python -m cel.study preflight --root data/raw/study-v1
      - name: Collect one session without inspecting holdout outcomes
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.mode == 'collect'
        env:
          SLOT: ${{ steps.gate.outputs.slot }}
        run: uv run --frozen python -m cel.study collect --slot "$SLOT" --root data/raw/study-v1
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.run == 'true'
        with:
          name: btc-study-session-${{ steps.gate.outputs.session }}
          path: |
            data/raw/study-v1/*.tar.gz
            data/raw/study-v1/*.sha256
          if-no-files-found: error
          retention-days: 90

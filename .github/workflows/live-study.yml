name: frozen live study

on:
  push:
    branches: [main]
    paths:
      - 'cel/study.py'
      - 'cel/ingest/instruments.py'
      - 'scripts/study_gate.py'
      - 'scripts/study_diagnostics.py'
      - '.github/workflows/live-study.yml'
      - 'configs/study_v1*'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preflight or one frozen-window session'
        required: true
        default: preflight
        type: choice
        options: [preflight, collect]
      slot:
        description: 'Frozen UTC slot (collection only)'
        required: true
        default: am
        type: choice
        options: [am, pm]
  schedule:
    - cron: '17 3 17-23 10 *'
    - cron: '17 15 17-23 10 *'

permissions:
  contents: read

concurrency:
  group: frozen-live-study-${{ (github.event_name == 'push' || inputs.mode == 'preflight') && 'preflight' || 'collection' }}
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check fixed study dates and slot before installing
        id: gate
        env:
          MODE: ${{ inputs.mode }}
          SLOT: ${{ inputs.slot }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          python scripts/study_gate.py --event "$GITHUB_EVENT_NAME" --mode "$MODE" --slot "$SLOT" --schedule "$SCHEDULE" --output "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Install exact dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install uv==0.12.23
          uv sync --frozen --python 3.12
      - name: Preflight public feeds
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.mode == 'preflight'
        run: uv run --frozen python -m cel.study preflight --root data/raw/study-v1 --summary "$GITHUB_STEP_SUMMARY"
      - name: Collect one session without inspecting holdout outcomes
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.mode == 'collect'
        env:
          SLOT: ${{ steps.gate.outputs.slot }}
        run: uv run --frozen python -m cel.study collect --slot "$SLOT" --root data/raw/study-v1 --summary "$GITHUB_STEP_SUMMARY"
      - name: Publish sanitized feed health for diagnosis
        if: always() && steps.gate.outputs.run == 'true'
        run: python scripts/study_diagnostics.py --root data/raw/study-v1
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.run == 'true'
        with:
          name: btc-study-session-${{ steps.gate.outputs.session }}
          path: |
            data/raw/study-v1/*.tar.gz
            data/raw/study-v1/*.sha256
          if-no-files-found: error
          retention-days: 90

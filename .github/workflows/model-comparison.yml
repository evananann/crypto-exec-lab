name: released secondary model comparison

on:
  push:
    branches: [main]
    paths: ['.github/workflows/model-comparison.yml']
  workflow_dispatch:
  workflow_run:
    workflows: [successor released study report]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
concurrency:
  group: released-secondary-model-comparison
  cancel-in-progress: false

jobs:
  compare:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Gate before scientific archives or numerical imports
        id: gate
        run: python -S -m research.model_comparison gate
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: steps.gate.outputs.active == 'true'
        with:
          python-version: '3.12'
      - name: Install frozen dependencies and compare every fixed candidate
        if: steps.gate.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install uv==0.12.23
          uv sync --frozen --python 3.12
          uv run --frozen python -m research.model_comparison released --output data/raw/model-comparison
      - name: Preserve unique immutable analysis and verify remote bytes
        if: steps.gate.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="secondary-model-comparison-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          tar -czf "$asset" -C data/raw/model-comparison comparison.json comparison.md checksums.json
          sha256sum "$asset" > "$asset.sha256"
          gh release upload study-archive-btc-execution-v1 "$asset" "$asset.sha256" --repo "$GITHUB_REPOSITORY"
          mkdir -p data/raw/model-readback
          gh release download study-archive-btc-execution-v1 --pattern "$asset" --pattern "$asset.sha256" --dir data/raw/model-readback --repo "$GITHUB_REPOSITORY"
          cmp "$asset" "data/raw/model-readback/$asset"
          cmp "$asset.sha256" "data/raw/model-readback/$asset.sha256"
          cd data/raw/model-readback
          sha256sum -c "$asset.sha256"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always() && steps.gate.outputs.active == 'true'
        with:
          name: secondary-model-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/raw/model-comparison/
          if-no-files-found: warn
          retention-days: 90

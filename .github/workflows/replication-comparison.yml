name: released replication comparison

on:
  workflow_run:
    workflows: [preregistered replication report]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      report_run_id:
        description: 'Completed main replication-report run containing both pairs'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  compare:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - name: Enforce the holdout release before downloading outcomes
        id: release
        # The manual gate mode checks release on any later date, including a
        # delayed workflow_run. Source-run identity is verified independently.
        run: python scripts/study_gate.py --plan configs/study_v2_okx.json --event workflow_dispatch --report --output "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.release.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Install frozen dependencies
        if: steps.release.outputs.run == 'true'
        run: |
          python -m pip install uv==0.12.23
          uv sync --frozen --python 3.12
      - name: Download and compare both verified reports
        if: steps.release.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.report_run_id }}
        run: |
          uv run --frozen python -m scripts.download_replication_reports --repository "$REPOSITORY" --run-id "$RUN_ID" --out data/raw/reports
          uv run --frozen python -m scripts.compare_replication --okx data/raw/reports/okx/bundle --bybit data/raw/reports/bybit/bundle --out data/raw/comparison
          cp data/raw/reports/run-provenance.json data/raw/comparison/
          cat data/raw/comparison/comparison.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.release.outputs.run == 'true'
        with:
          name: btc-replication-v2-comparison
          path: data/raw/comparison/
          retention-days: 90
          if-no-files-found: error

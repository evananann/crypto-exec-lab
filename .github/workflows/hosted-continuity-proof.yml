name: isolated hosted continuity proof
on:
  push:
    branches: ['codex/hosted-continuity-proof']
    paths: ['.github/workflows/hosted-continuity-proof.yml']
permissions:
  contents: read
concurrency:
  group: isolated-continuity-proof
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: memory
        with:
          path: .continuity-proof/state.json
          key: isolated-proof-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: isolated-proof-v1-
      - name: Retain or replay controlled counterexamples
        env:
          PROOF_RUN: ${{ github.run_id }}
          MATCHED_KEY: ${{ steps.memory.outputs.cache-matched-key }}
        run: |
          python -S - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from research.roadmap.self_review import review,check_case,validate_state
          state_path=Path('.continuity-proof/state.json')
          previous=json.loads(state_path.read_text()) if state_path.exists() else None
          prior_bytes=state_path.read_bytes() if previous is not None else None
          if previous is not None:
              validate_state(previous)
          def injected(case):
              if case['sign']==1:
                  raise AssertionError('explicitly injected continuity fixture')
              return check_case(case)
          report,state=review(seed=20261115 if previous is None else 20261116,count=60,
                              previous=previous,checker=injected if previous is None else check_case)
          if previous is None:
              assert report['cold_start'] and state['failures'] and len(state['history'])==1
          else:
              assert os.environ['MATCHED_KEY']
              assert previous['failures'] and previous['history']
              assert not report['cold_start'] and not report['critical_failure']
              assert report['previous_regressions_replayed']==len(previous['failures'])
              assert len(report['resolved_prior_case_ids'])==len(previous['failures'])
              assert state['history'][:-1]==previous['history'][-29:]
          out=Path('proof');out.mkdir()
          evidence={'run_id':os.environ['PROOF_RUN'],'phase':'seed' if previous is None else 'restore_replay',
                    'injected_synthetic_faults':True,'production_cache_used':False,
                    'matched_cache_key':os.environ['MATCHED_KEY'],
                    'restored_state_sha256':hashlib.sha256(prior_bytes).hexdigest() if prior_bytes else None,
                    'prior_state':previous,'report':report,'state':state}
          state_path.parent.mkdir(exist_ok=True)
          state_path.write_text(json.dumps(state,indent=2)+'\n')
          evidence['saved_state_sha256']=hashlib.sha256(state_path.read_bytes()).hexdigest()
          (out/'evidence.json').write_text(json.dumps(evidence,indent=2)+'\n')
          (out/'state.json').write_bytes(state_path.read_bytes())
          print(evidence['phase'], 'replayed=',report['previous_regressions_replayed'])
          PY
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .continuity-proof/state.json
          key: isolated-proof-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: hosted-continuity-${{ github.run_id }}
          path: proof/
          retention-days: 90
          if-no-files-found: error

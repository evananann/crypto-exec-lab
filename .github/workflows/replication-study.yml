name: preregistered replication collection

on:
  push:
    branches: [main]
    paths:
      - 'configs/study_v2*'
      - '.github/workflows/replication-study.yml'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [preflight, collect]
        default: preflight
      slot:
        type: choice
        options: [am, pm]
        default: am
  schedule:
    - cron: '17 3 * * *'
    - cron: '17 15 * * *'

permissions:
  contents: read

concurrency:
  group: replication-v2-${{ (github.event_name == 'push' || inputs.mode == 'preflight') && 'preflight' || 'collection' }}
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        pair: [okx, bybit]
    steps:
      - uses: actions/checkout@v4
      - name: Enforce this pair's frozen UTC window
        id: gate
        env:
          MODE: ${{ inputs.mode }}
          SLOT: ${{ inputs.slot }}
          SCHEDULE: ${{ github.event.schedule }}
          PAIR: ${{ matrix.pair }}
        run: python scripts/study_gate.py --plan "configs/study_v2_${PAIR}.json" --event "$GITHUB_EVENT_NAME" --mode "$MODE" --slot "$SLOT" --schedule "$SCHEDULE" --output "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Install frozen dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install uv==0.12.23
          uv sync --frozen --python 3.12
      - name: Record without inspecting outcomes
        if: steps.gate.outputs.run == 'true'
        env:
          PAIR: ${{ matrix.pair }}
          MODE: ${{ steps.gate.outputs.mode }}
          SLOT: ${{ steps.gate.outputs.slot }}
        shell: bash
        run: |
          options=()
          if [[ "$MODE" == collect ]]; then options+=(--slot "$SLOT"); fi
          uv run --frozen python -m cel.study --plan "configs/study_v2_${PAIR}.json" "$MODE" "${options[@]}" --root data/raw/replication --summary "$GITHUB_STEP_SUMMARY"
      - name: Publish collection health
        if: always() && steps.gate.outputs.run == 'true'
        run: python scripts/study_diagnostics.py --root data/raw/replication
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.run == 'true'
        with:
          name: btc-replication-v2-${{ matrix.pair }}-${{ steps.gate.outputs.session }}
          path: |
            data/raw/replication/*.tar.gz
            data/raw/replication/*.sha256
          retention-days: 90
          if-no-files-found: error

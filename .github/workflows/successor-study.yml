name: successor registered study

on:
  schedule:
    - cron: '17 21 * * *'
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      slot_id:
        description: 'Exact frozen slot; collector requires the authenticated early sender owner'
        required: true
        type: string
      dispatch_id:
        description: 'Original early sender client receipt ID'
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepare:
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write
      actions: write
    concurrency:
      group: successor-study-sender
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          persist-credentials: false
      - name: Prepare only a future slot in the committed registration
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.successor_study send --out data/raw/study-delivery
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        if: always()
        with:
          name: successor-study-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/raw/study-delivery/
          if-no-files-found: warn
          retention-days: 90
  collect:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    concurrency:
      group: successor-study-collector
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: '3.12'
      - name: Install before the original frozen start
        run: |
          python -m pip install uv==0.12.23
          uv sync --frozen --python 3.12
      - name: Authenticate, wait, claim, record, preserve and verify the frozen slot
        env:
          GH_TOKEN: ${{ github.token }}
          STUDY_SLOT: ${{ inputs.slot_id }}
          DISPATCH_ID: ${{ inputs.dispatch_id }}
        run: uv run --frozen python -m scripts.successor_study collect --out data/raw/successor-study
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        if: always()
        with:
          name: successor-study-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/raw/successor-study/
          if-no-files-found: warn
          retention-days: 90

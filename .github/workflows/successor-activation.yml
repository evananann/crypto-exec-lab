name: successor verified registration

on:
  workflow_dispatch:
  workflow_run:
    workflows: [successor collection rehearsal, successor qualification]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: successor-registration
  cancel-in-progress: false
jobs:
  freeze:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: '3.12'
      - name: Install frozen dependencies
        run: |
          python -m pip install uv==0.12.23
          uv sync --frozen --extra dev --python 3.12
      - name: Validate source before any automatic registration commit
        run: |
          uv run --frozen --extra dev ruff check .
          uv run --frozen --extra dev python -m unittest discover -s tests
      - name: Authenticate every trial and commit future registration only if all gates pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen python -m scripts.successor_study freeze --out data/raw/successor-registration
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        if: always()
        with:
          name: successor-registration-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/raw/successor-registration/
          if-no-files-found: warn
          retention-days: 90

name: released internal validation

on:
  workflow_dispatch:
    inputs:
      study:
        description: 'Released study to validate; date gates always apply'
        type: choice
        options: [all, v1, v2_okx, v2_bybit]
        default: all
  workflow_run:
    workflows: [frozen study report, preregistered replication report]
    branches: [main]
    types: [completed]
  schedule:
    - cron: '47 4 24 10 *'
    - cron: '47 4 23 11 *'

permissions:
  contents: read
  actions: read

concurrency:
  group: released-internal-validation
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        study: [v1, v2_okx, v2_bybit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Select applicable released study before downloading data
        id: gate
        env:
          STUDY: ${{ matrix.study }}
          REQUESTED: ${{ inputs.study || 'all' }}
          TRIGGER_WORKFLOW: ${{ github.event.workflow_run.name }}
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta, date, timezone
          import json, os
          from pathlib import Path
          study = os.environ['STUDY']
          path = Path('configs/study_' + study + '.json')
          plan = json.loads(path.read_text())
          now = datetime.now(timezone.utc)
          released = now.date() > date.fromisoformat(plan['end_date_utc'])
          event = os.environ['GITHUB_EVENT_NAME']
          selected = os.environ['REQUESTED'] in ('all', study)
          if event == 'workflow_run':
              selected = (study == 'v1') == (os.environ['TRIGGER_WORKFLOW'] == 'frozen study report')
          if event == 'schedule':
              selected = now.date() == date.fromisoformat(plan['end_date_utc']) + timedelta(days=1)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as target:
              target.write('run=' + str(released and selected).lower() + '\n')
              target.write('plan=' + str(path) + '\n')
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Install frozen dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install uv==0.12.23
          uv sync --frozen --python 3.12
      - name: Verify and restore all original scheduled attempts
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PLAN: ${{ steps.gate.outputs.plan }}
        run: |
          uv run --frozen python scripts/download_study_artifacts.py --repository "$REPOSITORY" --plan "$PLAN" --out data/raw/internal-downloads
          mkdir -p data/raw/internal-restored
          shopt -s nullglob
          for archive in data/raw/internal-downloads/*.tar.gz; do
            uv run --frozen python -m cel.study --plan "$PLAN" restore "$archive" --root data/raw/internal-restored
          done
      - name: Validate released estimates, independent cross-checks, sensitivity and real-tape performance
        if: steps.gate.outputs.run == 'true'
        env:
          PLAN: ${{ steps.gate.outputs.plan }}
        run: |
          uv run --frozen python -m scripts.released_validation --root data/raw/internal-restored --plan "$PLAN" --benchmark-repeats 3 --provenance-root data/raw/internal-downloads --out data/raw/internal-validation
          python -S scripts/released_validation.py --verify data/raw/internal-validation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.gate.outputs.run == 'true'
        with:
          name: internal-validation-${{ matrix.study }}
          path: data/raw/internal-validation/
          if-no-files-found: error
          retention-days: 90

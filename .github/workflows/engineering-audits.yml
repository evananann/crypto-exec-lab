name: optional engineering audits
on:
  push:
    branches: [main, 'research/**']
    paths: ['cel/**', 'research/**', 'scripts/**', 'tests/**', 'benchmarks/**', 'notebooks/**', '.github/workflows/engineering-audits.yml']
  pull_request:
    paths: ['cel/**', 'research/**', 'scripts/**', 'tests/**', 'benchmarks/**', 'notebooks/**', '.github/workflows/engineering-audits.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      IPYTHONDIR: /tmp/cel-ipython
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install a separate optional environment without editing the frozen lock
        run: |
          python -m pip install uv==0.12.23
          uv venv /tmp/cel-engineering
          uv export --frozen --extra dev --no-emit-project --no-editable --output-file /tmp/cel-project-requirements.txt
          uv pip install --python /tmp/cel-engineering/bin/python -r /tmp/cel-project-requirements.txt -r benchmarks/engineering-requirements.txt
      - name: Measure unit coverage and as-of identity/performance
        run: |
          mkdir -p data/raw/engineering
          COVERAGE_FILE=data/raw/engineering/.coverage /tmp/cel-engineering/bin/python -m coverage run --branch --source=cel,research,scripts -m unittest discover -s tests -v
          COVERAGE_FILE=data/raw/engineering/.coverage /tmp/cel-engineering/bin/python -m coverage json -o data/raw/engineering/coverage.json
          /tmp/cel-engineering/bin/python -m benchmarks.engineering_snapshot --coverage-json data/raw/engineering/coverage.json --output data/raw/engineering
          /tmp/cel-engineering/bin/python -m benchmarks.columnar_asof --count 100000 --repetitions 2 --output data/raw/engineering/columnar-smoke.json
      - name: Execute local and detached self-contained notebook
        run: |
          /tmp/cel-engineering/bin/python -m ipykernel install --prefix /tmp/cel-engineering --name cel-engineering
          export JUPYTER_PATH=/tmp/cel-engineering/share/jupyter
          /tmp/cel-engineering/bin/python -m benchmarks.execute_walkthrough --kernel cel-engineering --output data/raw/engineering/walkthrough-local.ipynb
          /tmp/cel-engineering/bin/python -m benchmarks.execute_walkthrough --kernel cel-engineering --detached --output data/raw/engineering/walkthrough-detached.ipynb
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: engineering-audit-${{ github.run_id }}
          path: data/raw/engineering/
          if-no-files-found: warn
          retention-days: 90

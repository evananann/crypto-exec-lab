name: qualification registration follow-up

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qualification-followup.yml'
  workflow_dispatch:
  schedule:
    - cron: '37 * 23-25 10 *'

permissions:
  contents: read
  actions: read

concurrency:
  group: successor-registration
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Bound reconciliation to the approved cohort and its publication window
        id: gate
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta, timezone
          import os
          from pathlib import Path
          from scripts.successor_claim import instant
          from scripts.successor_qualification import load_plan
          plan=load_plan()
          final=instant(plan['trials'][-1]['intended_start_utc'])
          now=datetime.now(timezone.utc)
          explicit=os.environ['GITHUB_EVENT_NAME'] in ('push','workflow_dispatch')
          active=(not Path('configs/successor/registered_study.json').exists() and
                  (explicit or final+timedelta(minutes=20)<=now<=final+timedelta(days=3)))
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
              stream.write('active='+str(active).lower()+'\n')
          print('::notice title=Qualification follow-up::reconcile='+str(active)+'; qualification is independently verified before any registration')
          PY
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        if: steps.gate.outputs.active == 'true'
        with:
          python-version: '3.12'
      - name: Install frozen dependencies
        if: steps.gate.outputs.active == 'true'
        run: |
          python -m pip install uv==0.12.23
          uv sync --frozen --extra dev --python 3.12
      - name: Validate the unchanged qualified source
        if: steps.gate.outputs.active == 'true'
        run: |
          uv run --frozen --extra dev ruff check .
          uv run --frozen --extra dev python -m unittest discover -s tests
      - name: Reconcile archives through the original frozen registration gate
        if: steps.gate.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen python -m scripts.successor_study freeze --out data/raw/qualification-followup
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        if: always() && steps.gate.outputs.active == 'true'
        with:
          name: qualification-followup-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/raw/qualification-followup/
          if-no-files-found: warn
          retention-days: 90

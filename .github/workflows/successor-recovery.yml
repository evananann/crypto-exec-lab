name: successor preservation recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/successor-recovery.yml'
      - 'scripts/successor_recovery.py'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Original rehearsal run ID; blank selects latest failed original'
        type: string
        required: false
  workflow_run:
    workflows: [successor collection rehearsal]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: successor-preservation-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: '3.12'
      - name: Install frozen dependencies
        run: |
          python -m pip install uv==0.12.23
          uv sync --frozen --python 3.12
      - name: Restore original artifact and resume remote preservation
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run_id || github.event.workflow_run.id }}
        run: |
          args=()
          if [ -n "$SOURCE_RUN" ]; then args+=(--run-id "$SOURCE_RUN"); fi
          uv run --frozen python -m scripts.successor_recovery --repository "$GITHUB_REPOSITORY" "${args[@]}" --out data/raw/successor-recovery
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        if: always()
        with:
          name: successor-recovery-${{ github.run_id }}
          path: |
            data/raw/successor-recovery/recovery.json
            data/raw/successor-recovery/download/**/remote-readback.json
          if-no-files-found: warn
          retention-days: 90

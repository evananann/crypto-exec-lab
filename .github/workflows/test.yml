name: test

on:
  push:
    branches: [main, 'research/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.23
          uv sync --frozen --extra dev --python ${{ matrix.python }}
      - name: Lint
        run: uv run --frozen --extra dev ruff check .
      - name: Unit and adversarial tests
        run: uv run --frozen --extra dev python -m unittest discover -s tests -v
      - name: Fixture CLIs and audit artifacts
        run: |
          uv run --frozen python -m cel
          uv run --frozen python -m cel.ingest replay data/fixtures/sample.jsonl
          uv run --frozen python -m cel.research --path data/fixtures/sample.jsonl --out-dir data/raw/ci-plots
          uv run --frozen python -m cel.execution --path data/fixtures/sample.jsonl --out data/raw/ci-execution.json
          uv run --frozen python -m cel.research.evaluate data/fixtures/sample.jsonl --out data/raw/ci-evaluation.json --markdown data/raw/ci-evaluation.md
          uv run --frozen python -m cel.experiments --demo --out data/raw/portfolio-ci
          python -S scripts/verify_bundle.py data/raw/portfolio-ci --expected-commit "$GITHUB_SHA" --source-repo .
          uv run --frozen python -m scripts.check_archive_restore --source reports/evidence --out data/raw/ci-restore-check.json
      - name: Prospective power and synthetic execution audits
        run: |
          uv run --frozen python -m scripts.power_audit --out data/raw/ci-power-audit
          uv run --frozen python -m scripts.execution_assumption_audit --out data/raw/ci-execution-audit
          uv run --frozen python -m scripts.missing_data_sensitivity --demo --out data/raw/ci-missing-data
          uv run --frozen python -m scripts.released_robustness --demo --out data/raw/ci-robustness
          uv run --frozen python -m scripts.crosscheck_markouts --demo --out data/raw/ci-crosscheck
          python -S scripts/reference_markouts.py --input data/fixtures/sample.jsonl --out data/raw/ci-reference.json
          uv run --frozen python -m scripts.failure_attribution --source reports/evidence --out data/raw/ci-failure-attribution
          uv run --frozen python -m scripts.order_lifecycle --demo --out data/raw/ci-lifecycle
          uv run --frozen python -m scripts.collection_timeline --demo --out data/raw/ci-timeline.json
          uv run --frozen python -m scripts.audit_recordings --source reports/evidence --out data/raw/ci-recording-integrity.json
          uv run --frozen python -m scripts.numeric_reproducibility --out data/raw/numeric/numeric.json
          uv run --frozen python -m scripts.released_validation --demo --out data/raw/ci-internal-validation
          python -S scripts/released_validation.py --verify data/raw/ci-internal-validation
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: research-checks-python-${{ matrix.python }}
          path: |
            data/raw/ci-*.json
            data/raw/ci-*.md
            data/raw/ci-plots/*.png
            data/raw/portfolio-ci/
            data/raw/ci-power-audit/
            data/raw/ci-execution-audit/
            data/raw/ci-missing-data/
            data/raw/ci-robustness/
            data/raw/ci-crosscheck/
            data/raw/ci-failure-attribution/
            data/raw/ci-lifecycle/
            data/raw/ci-internal-validation/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: numeric-python-${{ matrix.python }}
          path: data/raw/numeric/numeric.json
          if-no-files-found: error
          retention-days: 7

  numerical-agreement:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7, Node 24
        with:
          pattern: numeric-python-*
          path: data/raw/numeric-inputs
      - name: Compare numerical outputs from every supported Python version
        run: python -S scripts/numeric_reproducibility.py --compare-root data/raw/numeric-inputs --expected-commit "$GITHUB_SHA" --out data/raw/numerical-agreement.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        with:
          name: numerical-agreement
          path: data/raw/numerical-agreement.json
          retention-days: 7
          if-no-files-found: error

name: successor collection rehearsal

on:
  push:
    branches: [main]
    paths:
      - 'configs/successor/protocol.json'
      - 'configs/successor/warm_retry_20261022.json'
  workflow_dispatch:
    inputs:
      qualification_trial_id:
        description: 'Approved replacement-cohort trial ID; requires authenticated early sender ownership'
        type: string
        required: false
      intended_start_utc:
        description: 'Explicit UTC intent; manual dispatch within five minutes, approved cohort dispatches early to prepare'
        type: string
        required: true
      dispatch_sent_at_utc:
        description: 'Optional caller send timestamp from successor_dispatch; diagnostic only'
        type: string
        required: false
      dispatch_id:
        description: 'Optional caller receipt ID from successor_dispatch'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: successor-rehearsal
  cancel-in-progress: false

jobs:
  rehearsal:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      QUALIFICATION_TRIAL: ${{ inputs.qualification_trial_id }}
      QUALIFICATION_INTENDED: ${{ inputs.intended_start_utc }}
      QUALIFICATION_DISPATCH_ID: ${{ inputs.dispatch_id }}
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Validate warm preparation, owner and fixed intended start
        id: warmup
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.successor_warmup prepare
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        if: steps.warmup.outputs.warm == 'true'
        with:
          python-version: '3.12'
      - name: Install before the approved warm retry start
        if: steps.warmup.outputs.warm == 'true'
        run: |
          python -m pip install uv==0.12.23
          uv sync --frozen --python 3.12
      - name: Wait on the original intended time with dependencies ready
        if: steps.warmup.outputs.warm == 'true'
        run: python -m scripts.successor_warmup wait
      - name: Record explicit timing and gate before installing
        id: timing
        env:
          GH_TOKEN: ${{ github.token }}
          INTENDED_START: ${{ inputs.intended_start_utc }}
          CLIENT_SENT: ${{ inputs.dispatch_sent_at_utc }}
          DISPATCH_ID: ${{ inputs.dispatch_id }}
          WARM_RETRY: ${{ steps.warmup.outputs.warm }}
          WARM_INTENDED: ${{ steps.warmup.outputs.intended }}
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import json, os, re, subprocess
          from pathlib import Path
          from scripts.successor_claim import instant
          protocol = json.loads(Path('configs/successor/protocol.json').read_text())
          run = json.loads(subprocess.check_output(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}'], text=True))
          warm = os.environ.get('WARM_RETRY') == 'true'
          mode = 'prospective' if warm or os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch' else 'transport_only'
          intended = os.environ['WARM_INTENDED'] if warm else os.environ.get('INTENDED_START') or run['created_at']
          now = datetime.now(timezone.utc)
          client_sent = instant(os.environ['CLIENT_SENT']).isoformat() if os.environ.get('CLIENT_SENT') else None
          dispatch_id = os.environ.get('DISPATCH_ID') or None
          if dispatch_id is not None and not re.fullmatch('[0-9a-f]{32}',dispatch_id):
              raise ValueError('invalid caller receipt ID')
          lag = (now - instant(intended)).total_seconds()
          accepted = mode == 'transport_only' or 0 <= lag <= protocol['maximum_start_lateness_seconds']
          Path('data/raw/successor-control').mkdir(parents=True, exist_ok=False)
          trigger = {'event':os.environ['GITHUB_EVENT_NAME'],'run_id':run['id'], 'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
            'source_commit':os.environ['GITHUB_SHA'], 'intended_start_utc':intended,
            'run_created_at_utc':run['created_at'],'run_started_at_utc':run.get('run_started_at'),
            'gate_checked_at_utc':now.isoformat(),'gate_accepted':accepted,'mode':mode,
            'dispatch_sent_at_utc':client_sent,'dispatch_id':dispatch_id,'dispatch_receipt_at_utc':None,
            'dispatch_sent_source':'authenticated operator input, not server attestation' if client_sent else 'unavailable',
            'warm_retry': json.loads(Path('data/raw/successor-warmup/ready.json').read_text()) if warm else None,
            'limitation':'GitHub run creation is not the original dispatch receipt; no pre-creation delay inferred'}
          Path('data/raw/successor-control/trigger.json').write_text(json.dumps(trigger,indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:
            stream.write(f'mode={mode}\nintended={instant(intended).isoformat()}\nrun={str(accepted).lower()}\n')
          if not accepted:
            print('::warning title=Successor timing::Outside prospective start window; collection skipped')
          PY
      - name: Atomically claim intended slot
        if: steps.timing.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          INTENDED: ${{ steps.timing.outputs.intended }}
        run: python scripts/successor_claim.py --protocol configs/successor/protocol.json --repository "$GITHUB_REPOSITORY" --intended-start "$INTENDED" --source-commit "$GITHUB_SHA" --owner "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --out data/raw/successor-control/claim.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        if: steps.timing.outputs.run == 'true' && steps.warmup.outputs.warm != 'true'
        with:
          python-version: '3.12'
      - name: Install frozen dependencies
        if: steps.timing.outputs.run == 'true' && steps.warmup.outputs.warm != 'true'
        run: |
          python -m pip install uv==0.12.23
          uv sync --frozen --python 3.12
      - name: Record full 900-second infrastructure rehearsal
        if: steps.timing.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.timing.outputs.mode }}
          INTENDED: ${{ steps.timing.outputs.intended }}
        run: uv run --frozen python -m scripts.successor_rehearsal collect --mode "$MODE" --intended-start "$INTENDED" --claim data/raw/successor-control/claim.json --trigger data/raw/successor-control/trigger.json --out data/raw/successor-attempt
      - name: Preserve original and verify remote restore
        if: always() && steps.timing.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen python -m scripts.successor_rehearsal preserve --out data/raw/successor-attempt --repository "$GITHUB_REPOSITORY" --source-commit "$GITHUB_SHA"
      - name: Require healthy on-time data and verified remote restore
        if: steps.warmup.outputs.warm == 'true'
        run: python -m scripts.successor_warmup verify
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node 24
        if: always()
        with:
          name: successor-rehearsal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/raw/successor-warmup/
            data/raw/successor-control/
            data/raw/successor-attempt/*.json
            data/raw/successor-attempt/*.tar.gz*
          if-no-files-found: error
          retention-days: 90

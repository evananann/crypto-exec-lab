[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-exec-lab"
version = "0.1.0"
description = "Two-venue crypto execution lab (simulator, not live trading)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "websocket-client>=1.8",
]

[tool.setuptools.packages.find]
include = ["cel*"]
